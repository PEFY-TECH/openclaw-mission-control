version: 2
name: PEFY Code Modernization Fabric
mode: governed-provider-neutral
scope: account-wide-and-legacy-aware

control_plane:
  repository: PEFY-TECH/openclaw-mission-control
  policy: AGENTS.md
  promotion: fail-closed
  inheritance: explicit-adapter-or-repository-policy

execution_adapters:
  devswarm:
    type: external-proprietary-ade
    status: optional-workstation-adapter
    source: https://devswarm.ai/
    release_source: https://github.com/devswarm-ai/devswarm/releases/tag/v2.5.0
    evaluation_baseline: v2.5.0
    release_published: "2026-09-08"
    license_mode: proprietary
    distribution: official-devswarm-installer-only
    data_model: local-first
    isolation: git-worktree-per-workspace
    security_boundary: worktree-is-not-os-sandbox
    provenance:
      immutable_release_tag_required: true
      installer_sha256_capture_required: true
      platform_signature_validation_required: true
      signer_identity_capture_required: true
      retrieval_timestamp_required: true
      installer_evidence_before_launch_required: true
      rollback_installer_retention_required: true
      rollback_digest_required: true
      evidence_must_exclude_secrets: true
    approved_distribution_endpoints:
      macos_arm64: https://downloads.devswarm.ai/darwin/arm64/DevSwarm.dmg
      windows_x64: https://downloads.devswarm.ai/win32/x64/DevSwarm.exe
    activation_requires:
      - supported macOS or Windows workstation
      - Git in PATH
      - at least one catalogued and health-verified supported AI assistant CLI
      - version/hash/signature/signer evidence captured before first launch
      - rollback installer or independently retained approved artifact with digest
      - operator sign-in to DevSwarm
      - repository added with correct default branch
      - PEFY policy adapters present
  clawteam:
    type: pefy-multi-agent-runtime
    status: code-gate-pending
  openclaw:
    type: pefy-default-agent-runtime
    status: rebaseline-blocked

instruction_adapters:
  canonical: AGENTS.md
  claude_code: CLAUDE.md
  gemini_cli: GEMINI.md
  github_copilot: .github/copilot-instructions.md
  cursor: .cursor/rules/pefy-engineering.mdc
  generic_cli_agent: AGENTS.md

assistant_policy:
  detection: catalogued-runtime-discovery-plus-version-probe
  required_count_minimum: 1
  arbitrary_executable_counts_as_supported: false
  catalogue_change_requires_review: true
  known_command_adapters:
    claude: Claude Code
    codex: OpenAI Codex
    gemini: Gemini CLI
    copilot: GitHub Copilot
    cursor: Cursor CLI
    aider: Aider
    goose: Goose
    opencode: OpenCode
    amp: Amp
    qwen: Qwen Code
  known_families:
    - OpenAI Codex
    - Claude Code
    - Gemini CLI
    - GitHub Copilot
    - Cursor CLI
    - Amazon Q
    - Atlassian Rovo
    - Goose
    - Aider
    - Amp
    - Mistral Vibe
    - Qwen Code
    - OpenCode
    - Cline
    - Plandex
    - Droid
  future_assistants: allowed-only-after-catalogue-and-adapter-qualification

legacy_policy:
  mode: strangler-compatible-incremental-modernization
  preserve_behavior_before_refactor: true
  require_characterization_tests_when_existing_tests_are_insufficient: true
  permit_compatibility_shims: true
  permit_dual-run_or_shadow-mode_when_risk_justifies: true
  database_migrations_must_be_backward-compatible_when_practicable: true
  destructive_migrations_require_explicit_approval_and_restore_proof: true
  unsupported_runtime_requires_isolation-and-retirement-plan: true
  no_forced_big_bang_rewrite: true
  archive_or_retire_only_with_owner_and_evidence: true

modernization_pipeline:
  - discovery
  - inventory
  - provenance-and-license
  - legacy-and-compatibility-classification
  - architecture-impact
  - sbom-and-dependency-analysis
  - vulnerability-and-secret-analysis
  - characterization-or-test-baseline
  - migration-or-refactor
  - compatibility-adapter-or-strangler-slice-when-needed
  - static-analysis
  - unit-and-integration-tests
  - build
  - e2e-when-applicable
  - performance-and-reliability-evidence
  - security-negative-paths
  - review
  - pull-request
  - ci-gates
  - rollback-proof
  - promotion

promotion_requirements:
  code_qualified:
    - immutable candidate SHA
    - required CI green
    - review findings resolved
    - runtime high vulnerabilities equal 0
    - runtime critical vulnerabilities equal 0
    - reproducible lockfiles where applicable
    - no secret leakage in evidence
    - legacy compatibility evidence where applicable
  runtime_qualified:
    - code_qualified
    - real-host health and readiness
    - required agent/runtime connectivity
    - allowed-action proof
    - denied-or-approval-gated-action proof
    - audit/log evidence
    - rollback target
  live_production_active:
    - runtime_qualified
    - production deployment identity
    - backup verification
    - restore or rollback drill evidence
    - release acceptance record

security_tools:
  codex_security_plugin:
    status: user-install-required
    role: security scan and investigation
    account_plugin_verified_installed: false
  github:
    status: connected
    role: source, PR, CI and evidence
  context7:
    status: connected
    role: current library documentation
  additional_cli_tools:
    policy: discover-verify-pin-before-adoption
    examples:
      - Semgrep
      - CodeQL
      - OSV-Scanner
      - Syft
      - Grype
      - Trivy
      - Gitleaks
      - Renovate
      - Dependabot
      - OpenRewrite

forbidden_shortcuts:
  - unrestricted execution to bypass allowlists
  - blind dependency upgrades
  - blind upstream sync or rebase
  - unreviewed auto-merge
  - secrets in repository or evidence artifacts
  - arbitrary executable treated as supported assistant without catalogue qualification
  - production qualification inferred from installation alone
  - big-bang legacy rewrite without compatibility and rollback evidence
