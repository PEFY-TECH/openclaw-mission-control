name: ECC qualification

on:
  pull_request:
    paths:
      - 'scripts/pefy-ecc-install.sh'
      - 'scripts/pefy-ecc-codex-native.sh'
      - 'scripts/pefy-ecc-status.sh'
      - 'scripts/pefy-ecc'
      - '.github/workflows/ecc-qualification.yml'
      - '.github/workflows/ecc-host-activation.yml'
      - 'docs/ECC_INTEGRATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecc-dual-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECC_VERSION: '2.2.1'
      ECC_PROFILE: core
      ECC_TARGET: codex
      ECC_REQUIRE_NATIVE_CODEX: '1'
      CODEX_VERSION: '0.154.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate operator scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/pefy-ecc-install.sh
          bash -n scripts/pefy-ecc-codex-native.sh
          bash -n scripts/pefy-ecc-status.sh
          bash -n scripts/pefy-ecc
          bash scripts/pefy-ecc --help

      - name: Record npm provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          npm view "ecc-universal@${ECC_VERSION}" version dist.integrity dist.shasum --json
          npm view "@openai/codex@${CODEX_VERSION}" version dist.integrity dist.shasum --json

      - name: Install pinned Codex CLI for native plugin qualification
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "@openai/codex@${CODEX_VERSION}"
          codex --version
          codex plugin --help >/dev/null

      - name: Install and verify both ECC layers
        shell: bash
        run: bash scripts/pefy-ecc install

      - name: Verify operator status and pinned version
        shell: bash
        run: |
          set -euo pipefail
          test "$(bash scripts/pefy-ecc version)" = "${ECC_VERSION}"
          bash scripts/pefy-ecc status
