name: PEFY Frontend Lock Candidate

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - ".github/workflows/pefy-lock-candidate.yml"

permissions:
  contents: write

jobs:
  generate-lock-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve deterministic lock candidate
        run: |
          set -euo pipefail
          cd frontend
          npm install --package-lock-only --ignore-scripts

      - name: Audit production dependency graph
        run: |
          set -euo pipefail
          mkdir -p artifacts/pefy-lock-candidate
          cd frontend
          npm audit --omit=dev --json > ../artifacts/pefy-lock-candidate/npm-audit-production.json || true
          cp package-lock.json ../artifacts/pefy-lock-candidate/package-lock.json
          cp package.json ../artifacts/pefy-lock-candidate/package.json

      - name: Enforce candidate production severity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("artifacts/pefy-lock-candidate/npm-audit-production.json").read_text())
          counts = audit.get("metadata", {}).get("vulnerabilities", {})
          print("Candidate production audit:", counts)
          if not isinstance(counts, dict):
              raise SystemExit("npm audit metadata missing")
          critical = int(counts.get("critical", 0) or 0)
          high = int(counts.get("high", 0) or 0)
          if critical or high:
              raise SystemExit(f"Refusing to commit vulnerable lock candidate: critical={critical}, high={high}")
          PY

      - name: Commit audited lockfile to PR branch
        env:
          PEFY_PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already matches audited dependency graph"
            exit 0
          fi
          git config user.name "PEFY Production Gate"
          git config user.email "pefy-production-gate@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "security(frontend): refresh audited dependency lockfile"
          git push origin "HEAD:${PEFY_PR_BRANCH}"

      - name: Upload lock candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pefy-frontend-lock-candidate
          if-no-files-found: error
          path: artifacts/pefy-lock-candidate/**
