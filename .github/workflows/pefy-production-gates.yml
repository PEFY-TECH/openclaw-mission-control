name: PEFY Production Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/project-gallery/**"
      - "compose.yml"
      - "compose.production.yml"
      - "deploy/pefy-production.env.example"
      - "scripts/pefy-*.sh"
      - "docs/pefy-**"
      - ".github/workflows/pefy-production-gates.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/project-gallery/**"
      - "compose.yml"
      - "compose.production.yml"
      - "deploy/pefy-production.env.example"
      - "scripts/pefy-*.sh"
      - "docs/pefy-**"
      - ".github/workflows/pefy-production-gates.yml"
  workflow_dispatch:

concurrency:
  group: pefy-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Validate PEFY production shell syntax
        run: |
          bash -n scripts/pefy-production-smoke.sh
          bash -n scripts/pefy-backup-postgres.sh
          bash -n scripts/pefy-verify-backup.sh
          bash -n scripts/pefy-restore-postgres.sh

      - name: Validate development Compose configuration
        env:
          AUTH_MODE: local
          BASE_URL: http://localhost:8000
        run: |
          export LOCAL_AUTH_TOKEN="$(python -c 'print("x" * 64)')"
          export POSTGRES_PASSWORD="$(python -c 'print("p" * 32)')"
          docker compose -f compose.yml config --quiet

      - name: Validate hardened production Compose configuration
        env:
          AUTH_MODE: local
          BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          CORS_ORIGINS: https://mission-control.example.invalid
        run: |
          export LOCAL_AUTH_TOKEN="$(python -c 'print("x" * 64)')"
          export POSTGRES_PASSWORD="$(python -c 'print("p" * 32)')"
          docker compose -f compose.production.yml config --quiet

      - name: Install backend dependencies
        run: make backend-sync

      - name: Run production-readiness regression tests
        env:
          AUTH_MODE: local
          BASE_URL: http://localhost:8000
        run: |
          export LOCAL_AUTH_TOKEN="$(python -c 'print("x" * 64)')"
          cd backend
          uv run pytest tests/test_readiness_api.py -v --tb=short

      - name: Capture production frontend dependency audit
        run: |
          mkdir -p artifacts/pefy-production-gates
          cd frontend
          npm audit --omit=dev --json > ../artifacts/pefy-production-gates/npm-audit-production.json || true

      - name: Execute smoke redaction fixture
        env:
          PEFY_FIXTURE_TOKEN: fixture-super-secret-token-0123456789-0123456789-0123456789
        run: |
          set -euo pipefail
          EVIDENCE_DIR="artifacts/pefy-smoke-fixture"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"

          python - <<'PY' &
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          token = os.environ["PEFY_FIXTURE_TOKEN"]

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def send_payload(self, code, payload, content_type="application/json"):
                  body = payload if isinstance(payload, bytes) else json.dumps(payload).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path in {"/healthz", "/readyz"}:
                      self.send_payload(200, {"ok": True})
                      return
                  if self.path == "/project-gallery":
                      self.send_payload(
                          200,
                          b"<html><body>fixture-private-gallery-content</body></html>",
                          "text/html",
                      )
                      return
                  self.send_payload(404, {"detail": "not found"})

              def do_POST(self):
                  if self.path != "/api/v1/auth/bootstrap":
                      self.send_payload(404, {"detail": "not found"})
                      return
                  if self.headers.get("Authorization") == f"Bearer {token}":
                      self.send_payload(
                          200,
                          {
                              "email": "sensitive@example.invalid",
                              "context": "fixture-private-context",
                              "is_super_admin": True,
                              "token_echo": token,
                          },
                      )
                      return
                  self.send_payload(
                      401,
                      {
                          "detail": "fixture-private-denial-body",
                          "operator": "sensitive@example.invalid",
                      },
                  )

          ThreadingHTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null

          PEFY_MC_BACKEND_URL=http://127.0.0.1:18080 \
          PEFY_MC_FRONTEND_URL=http://127.0.0.1:18080 \
          PEFY_MC_LOCAL_AUTH_TOKEN="$PEFY_FIXTURE_TOKEN" \
          PEFY_MC_EVIDENCE_DIR="$EVIDENCE_DIR" \
          bash scripts/pefy-production-smoke.sh

          if grep -R -F "$PEFY_FIXTURE_TOKEN" "$EVIDENCE_DIR"; then
            echo "Smoke evidence leaked the authentication token"
            exit 1
          fi
          if grep -R -E 'sensitive@example\.invalid|fixture-private-context|fixture-private-denial-body|fixture-private-gallery-content' "$EVIDENCE_DIR"; then
            echo "Smoke evidence leaked fixture identity or response-body material"
            exit 1
          fi

          python - "$EVIDENCE_DIR" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {
              "healthz.json",
              "healthz.status",
              "readyz.json",
              "readyz.status",
              "project-gallery.status",
              "unauthenticated-bootstrap.status",
              "authenticated-bootstrap.status",
              "summary.json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"Unexpected smoke evidence files: expected={sorted(expected)} actual={sorted(actual)}")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if summary.get("secret_material_recorded") is not False:
              raise SystemExit("Smoke summary did not explicitly record secret redaction")
          if summary.get("identity_profile_recorded") is not False:
              raise SystemExit("Smoke summary did not explicitly record identity-profile redaction")
          PY

      - name: Verify production invariants in source
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke = Path("scripts/pefy-production-smoke.sh").read_text(encoding="utf-8")
          backup = Path("scripts/pefy-backup-postgres.sh").read_text(encoding="utf-8")
          restore = Path("scripts/pefy-restore-postgres.sh").read_text(encoding="utf-8")
          compose = Path("compose.yml").read_text(encoding="utf-8")
          production_compose = Path("compose.production.yml").read_text(encoding="utf-8")
          main = Path("backend/app/main.py").read_text(encoding="utf-8")
          readiness = Path("backend/app/core/readiness.py").read_text(encoding="utf-8")
          gallery = Path("frontend/src/app/project-gallery/page.tsx").read_text(encoding="utf-8")

          required = {
              "dependency-aware readyz": "check_readiness()" in main,
              "503 not-ready semantics": "HTTP_503_SERVICE_UNAVAILABLE" in main,
              "readiness probes RQ Redis": '"rq_redis"' in readiness and "settings.rq_redis_url" in readiness,
              "readiness I/O is bounded": "asyncio.timeout" in readiness,
              "development compose uses readyz": "/readyz" in compose,
              "production compose uses readyz": "/readyz" in production_compose,
              "production db has no published port": "127.0.0.1:${POSTGRES_PORT" not in production_compose,
              "production data network is internal": "internal: true" in production_compose,
              "production rate limit uses redis": "RATE_LIMIT_BACKEND: redis" in production_compose,
              "smoke proves denied access": "unauthenticated-bootstrap" in smoke,
              "smoke does not persist auth profiles": "authenticated-bootstrap.json" not in smoke and "unauthenticated-bootstrap.json" not in smoke,
              "smoke does not persist UI body": "project-gallery.html" not in smoke,
              "backup requires age encryption": "PEFY_BACKUP_AGE_RECIPIENT" in backup and "age --recipient" in backup,
              "restore requires destructive confirmation": "RESTORE_PRODUCTION_DATA" in restore,
              "gallery separates assurance state": "AssuranceState" in gallery,
              "gallery defaults Mission Control to pending": "NEXT_PUBLIC_PEFY_MC_ASSURANCE" in gallery and "code-gate-pending" in production_compose,
              "gallery declares evaluation-only candidates": "Evaluation only" in gallery,
              "gallery exposes U4 runtime blocker": "Rebaseline blocked" in gallery,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("Production invariants failed: " + ", ".join(failed))
          print("All PEFY production invariants satisfied")
          PY

      - name: Capture candidate provenance manifest
        env:
          PEFY_CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PEFY_TESTED_MERGE_OR_COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/pefy-production-gates
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "candidate_head_sha=${PEFY_CANDIDATE_HEAD_SHA}"
            echo "tested_merge_or_commit_sha=${PEFY_TESTED_MERGE_OR_COMMIT_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/pefy-production-gates/provenance.txt
          sha256sum \
            backend/uv.lock \
            frontend/package-lock.json \
            compose.yml \
            compose.production.yml \
            deploy/pefy-production.env.example \
            scripts/pefy-production-smoke.sh \
            scripts/pefy-backup-postgres.sh \
            scripts/pefy-verify-backup.sh \
            scripts/pefy-restore-postgres.sh \
            > artifacts/pefy-production-gates/artifact-sha256.txt

      - name: Enforce production dependency risk threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/pefy-production-gates/npm-audit-production.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Production dependency audit evidence is unreadable: {exc}") from exc

          vulnerabilities = data.get("metadata", {}).get("vulnerabilities")
          if not isinstance(vulnerabilities, dict):
              raise SystemExit("Production dependency audit did not return vulnerability metadata; fail closed")

          critical = int(vulnerabilities.get("critical", 0) or 0)
          high = int(vulnerabilities.get("high", 0) or 0)
          moderate = int(vulnerabilities.get("moderate", 0) or 0)
          low = int(vulnerabilities.get("low", 0) or 0)
          print(f"Production dependency audit: critical={critical} high={high} moderate={moderate} low={low}")
          if critical or high:
              raise SystemExit(
                  f"Production dependency risk gate failed: critical={critical}, high={high}"
              )
          PY

      - name: Upload production-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pefy-production-gate-evidence
          if-no-files-found: error
          path: artifacts/pefy-production-gates/**
