name: PEFY Production Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/app/project-gallery/**"
      - "compose.yml"
      - "scripts/pefy-production-smoke.sh"
      - "docs/pefy-**"
      - ".github/workflows/pefy-production-gates.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/src/app/project-gallery/**"
      - "compose.yml"
      - "scripts/pefy-production-smoke.sh"
      - "docs/pefy-**"
      - ".github/workflows/pefy-production-gates.yml"
  workflow_dispatch:

concurrency:
  group: pefy-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Validate production smoke script syntax
        run: bash -n scripts/pefy-production-smoke.sh

      - name: Validate Compose configuration
        env:
          AUTH_MODE: local
          BASE_URL: http://localhost:8000
        run: |
          export LOCAL_AUTH_TOKEN="$(python -c 'print("x" * 64)')"
          export POSTGRES_PASSWORD="$(python -c 'print("p" * 32)')"
          docker compose -f compose.yml config --quiet

      - name: Install backend dependencies
        run: make backend-sync

      - name: Run production-readiness regression tests
        env:
          AUTH_MODE: local
          BASE_URL: http://localhost:8000
        run: |
          export LOCAL_AUTH_TOKEN="$(python -c 'print("x" * 64)')"
          cd backend
          uv run pytest tests/test_readiness_api.py -v --tb=short

      - name: Verify production invariants in source
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke = Path("scripts/pefy-production-smoke.sh").read_text(encoding="utf-8")
          compose = Path("compose.yml").read_text(encoding="utf-8")
          main = Path("backend/app/main.py").read_text(encoding="utf-8")
          gallery = Path("frontend/src/app/project-gallery/page.tsx").read_text(encoding="utf-8")

          required = {
              "dependency-aware readyz": "check_readiness()" in main,
              "503 not-ready semantics": "HTTP_503_SERVICE_UNAVAILABLE" in main,
              "compose uses readyz": "/readyz" in compose,
              "smoke proves denied access": "unauthenticated-bootstrap" in smoke,
              "smoke does not record auth token": "secret_material_recorded" in smoke,
              "gallery separates assurance state": "AssuranceState" in gallery,
              "gallery declares evaluation-only candidates": "Evaluation only" in gallery,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("Production invariants failed: " + ", ".join(failed))
          print("All PEFY production invariants satisfied")
          PY

      - name: Capture candidate provenance manifest
        run: |
          mkdir -p artifacts/pefy-production-gates
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/pefy-production-gates/provenance.txt
          sha256sum backend/uv.lock frontend/package-lock.json compose.yml \
            scripts/pefy-production-smoke.sh \
            > artifacts/pefy-production-gates/artifact-sha256.txt

      - name: Upload production-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pefy-production-gate-evidence
          if-no-files-found: error
          path: artifacts/pefy-production-gates/**
